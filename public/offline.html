<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COGNORYX — Offline</title>
  <meta name="theme-color" content="#00c6ff" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      color: #e8e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #00c6ff, #8a2be2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, #00c6ff, #8a2be2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .pulse {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid #00c6ff;
      margin: 0 auto 32px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.4; }
    }
    button {
      padding: 14px 32px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00c6ff, #8a2be2);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
    }
    button:hover { opacity: 0.9; }
    .status {
      margin-top: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="logo">CX</div>
  <h1>You're Offline</h1>
  <p>COGNORYX needs an internet connection to power its AI features. Please check your connection and try again.</p>
  <div class="pulse"></div>
  <button onclick="location.reload()">Try Again</button>
  <div class="status" id="status">Waiting for connection...</div>

  <script>
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = '✅ Back online! Reloading...';
      setTimeout(() => location.href = '/dashboard', 1000);
    });
    window.addEventListener('offline', () => {
      document.getElementById('status').textContent = '❌ Still offline...';
    });
  </script>
</body>
</html>
